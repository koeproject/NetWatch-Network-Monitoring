zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: f932b7b827924f58917ec66a7df59969
      name: Templates/NetWatch
  templates:
    - uuid: bd255d8af2f042dfaddcbd72b3a44502
      template: 'NetWatch ICMP Ping'
      name: 'NetWatch ICMP Ping'
      description: |
        Template Net ICMP Ping
        
        Generated by official Zabbix template tool "Templator"
      vendor:
        name: Zabbix
        version: 7.0-2
      groups:
        - name: Templates/NetWatch
      items:
        - uuid: e7ad23cc248742f8b27e5fe7cb1b9c46
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
            - tag: metric
              value: icmp_ping
          triggers:
            - uuid: 603b8835814c47d7a2c507b893b5860f
              expression: 'max(/NetWatch ICMP Ping/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: netwatch
                  value: reachability
                - tag: scope
                  value: availability
        - uuid: 526d883a3c78450786f7b628400aa54f
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
            - tag: metric
              value: icmp_loss
          triggers:
            - uuid: fcacef019fef452a8fdef6763d3614fa
              expression: 'min(/NetWatch ICMP Ping/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/NetWatch ICMP Ping/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/NetWatch ICMP Ping/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 49a0ddb13d97406782b19c070d663858
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
            - tag: metric
              value: icmp_rtt
          triggers:
            - uuid: ca6acaf0f5ee419c81878d5853985eed
              expression: 'avg(/NetWatch ICMP Ping/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/NetWatch ICMP Ping/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/NetWatch ICMP Ping/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/NetWatch ICMP Ping/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
      tags:
        - tag: class
          value: network
        - tag: target
          value: icmp
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
      valuemaps:
        - uuid: 6200379301fc45d1a8be0a70c550f13b
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
